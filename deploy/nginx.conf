server {
    listen 80;
    server_name kana.kevinlau.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kana.kevinlau.cn;

    root /www/wwwroot/kana.kevinlau.cn/current;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/kevinlau.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/kevinlau.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /www/wwwlogs/kana.kevinlau.cn.log;
    error_log /www/wwwlogs/kana.kevinlau.cn.error.log;
}
